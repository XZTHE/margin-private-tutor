name = "margin-private-tutor"
main = "index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://YOUR_USERNAME.github.io"
# Set a currently available multimodal structured-output model in your free project.
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Change only after verifying the Gemini project has no paid billing enabled.
FREE_TIER_CONFIRMED = "false"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
